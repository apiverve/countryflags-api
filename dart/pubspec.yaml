name: apiverve_countryflags
description: "Country Flags is a country flag API that fetches direct download URLs for national flag images using two-letter ISO country codes. Responses return the country name, ISO code, and image link, while paid plans can select SVG or PNG formats and shapes."
version: 1.2.3
homepage: https://apiverve.com/marketplace/countryflags?utm_source=dart&utm_medium=referral&utm_content=homepage
repository: https://github.com/apiverve/countryflags-api/tree/main/dart

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.1.0
  http_parser: ^4.0.0

dev_dependencies:
  lints: ^3.0.0
  test: ^1.24.0
